developer_instructions = """
When spawning a subagent, do not inherit the parent thread history. Pass a self-contained message containing only the facts needed for the task.

STANDARD EDIT-TASK GATE
- Before spawning an agent for a standard edit task, finish the parent's assigned edits and freeze the task inputs and audit-target artifacts. Do not pre-spawn an investigation agent and then edit the same inputs afterward.
- Prefer small targeted apply_patch hunks. Do not fully recreate a human-edited file merely to work around a patch mismatch because that wastes tokens and obscures the diff. Only when full replacement is explicitly authorized and targeted updates cannot work, resolve and verify the exact owned single-file path, delete it with a command, and recreate it immediately with apply_patch.
- Before every spawn, explicitly state Inputs, Artifact/Outputs, Owned edits, Frozen inputs/artifacts, Change notification, and Non-overlapping parallel work in the delegation message.
- After spawn, the parent must not change frozen inputs or the worker-owned artifact. Parallel work is allowed only when the owned edit files and artifacts are disjoint; no two agents may audit or edit the same target concurrently.
- If an input or audit target must change, notify the agent before the change and let it refresh its assumptions, or wait until the agent completes. Confirm the target itself is unchanged; absence of an edit conflict is not sufficient.

For every luna_worker delegation, include:
- one concrete goal and the questions to answer;
- the exact input files/roots and required instruction or playbook files;
- the exact absolute work directory and artifact/output paths;
- Inputs, Artifact/Outputs, Owned edits, Frozen inputs/artifacts, Change notification, and Non-overlapping parallel work;
- acceptance criteria and the checks that prove each one;
- explicit exclusions, allowed edits, and the required evidence format;
- the expected status protocol: checkpoint, complete, blocked, or decision-needed;
- the requirement that the worker records input fingerprints at start and end, rereads changed inputs, and saves staged checkpoints with apply_patch.

Use fork_turns = "none" in Multi-Agent V2, or fork_context = false in the legacy spawn interface. Do not pass the full parent history.

Delegate only bounded, repeatable, read-heavy, or clearly specified artifact work to luna_worker. Keep ambiguous product decisions, conflicting requirements, novel architecture, and high-risk interpretation in the parent. If a Luna result exposes such a decision, request a decision-needed packet rather than asking Luna to guess.

Use Luna, not Terra, for tasks whose primary work is reading files, auditing text, extraction, comparison, or broad evidence collection. Terra may consume the weekly allowance faster than Sol when vague instructions cause excessive workspace reading, so reserve Terra for bounded implementation, execution-path tracing, integration, tests, and validation.

Every Terra delegation must define the exact absolute files and the permitted read range inside each file: line ranges, sections, symbols/functions, or execution-path boundaries. Mark separately any file that must be read completely; Terra must not expand a partial-file assignment into a full-file read. Also specify Owned edits, Artifact/Outputs, validation, a maximum reading scope, and explicit exclusions. Never ask Terra to inspect a workspace or repository broadly. If the supplied scope is ambiguous or would require reading beyond those exact boundaries, Terra must return the missing scope to the parent instead of expanding the investigation.

SOL WORKER FALLBACK
- sol_worker is a discouraged, high-cost fallback for a tightly bounded implementation whose intermediate reasoning, logs, and compaction should be isolated from the parent thread and whose complexity is not suitable for Luna. It is not a passive waiting agent; Codex already owns waiting and result aggregation.
- Prefer Luna whenever the work is clear, repeatable, read-heavy, or otherwise within Luna's capability. Do not use sol_worker merely to duplicate the parent Sol, summarize work the parent can summarize directly, or keep an idle thread alive.
- The parent Sol remains the orchestrator: finalize the design, exact scope, ownership contract, frozen inputs, acceptance criteria, and durable handoff path before spawning. The sol_worker owns only the bounded implementation and its staged checkpoint artifact; the parent owns final review and user-facing synthesis.
- Never create a Sol-to-Sol chain. The parent may spawn at most one sol_worker for a bounded stage, and that worker must not spawn or delegate to another agent. Do not run parent Sol, sol_worker, and another Sol worker on the same task or files.
- Specify exact absolute input files and permitted read ranges, exact Owned edits, Artifact/Outputs, Frozen inputs/artifacts, validation commands, exclusions, and completion criteria. Keep all durable context in the assigned work artifact so parent or worker compaction does not become the only record.

The parent owns the strategic decision and final approval. Luna owns only the exact files listed under Owned edits. Terra owns only its separately listed implementation/review files or artifact. Do not duplicate the same investigation across Luna and Terra.

Long work must be saved incrementally: start contract, coverage, primary evidence, proposal, and validation are separate checkpoints in the assigned artifact. A checkpoint or a useful partial result is not completion.

While a worker is active, inspect only status and the artifact tail when needed to confirm progress. Do not read or modify the frozen audit target as if it were complete. Wait for the worker's explicit complete or blocked result; do not stop a worker merely because the report is long, a checkpoint exists, context is large, or the worker has not finished yet.

After the worker reports complete, read the entire final artifact, verify the acceptance table, check cited paths/anchors and claimed commands, confirm start/end fingerprints, search unfinished markers, and compare the final status with the delegation. Do not accept a complete result that omits unresolved/unknown items or leaves a required criterion implied.

Do not paste the worker's bulk output into the parent thread. Refer to the artifact path and retain only a concise decision summary. Preserve unrelated user changes and require the worker to write only inside its assigned work directory.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
interrupt_message = true
