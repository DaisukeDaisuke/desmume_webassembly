name: Build DeSmuME WebAssembly and Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: ["main", "webassembly"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get DeSmuME revision
        id: desmume-revision
        run: echo "sha=$(git -C old/desmume rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          
      - name: Install JavaScript dependencies
        run: |
          npm ci --ignore-scripts
          test "$(npm config get ignore-scripts)" = "true"

      - name: Verify bundled dependency boundary
        run: |
          npm run check:dependency-bundles

      - name: Test and verify first-party JavaScript
        run: |
          npm test
          npm run check:js
          npm run check:licenses

      - name: Build and verify source-derived artifacts
        run: |
          npm run build:notices
          npm run build:js
          git diff --check
          test -s public/app.js
          git diff --exit-code -- public/THIRD_PARTY_NOTICES.txt
          test -z "$(git status --porcelain --untracked-files=all -- public/THIRD_PARTY_NOTICES.txt)"

      - name: Restore cached WebAssembly output
        id: wasm-cache
        uses: actions/cache@v6
        with:
          path: |
            public/desmume.js
            public/desmume.worker.js
          key: wasm-output-${{ runner.os }}-${{ steps.desmume-revision.outputs.sha }}-${{ hashFiles('webassembly/build.sh', 'webassembly/runtime-state-contract.h', 'webassembly/support.c', 'webassembly/wasm-port.cpp', 'package.json', 'package-lock.json') }}

      - name: Install Emscripten
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update > /dev/null 2>&1
          sudo apt-get install -y emscripten > /dev/null 2>&1

      - name: Build WebAssembly
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        env:
          OUTPUT_DIR: ${{ github.workspace }}/public
        run: |
          bash webassembly/build.sh

      - name: Minify Emscripten JavaScript
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          npm run minify:wasm

      - name: Verify Pages output
        run: |
          test -f public/index.html
          test -f public/app.js
          test -f public/coi-serviceworker.js
          test -f public/desmume.js
          test ! -d public/src
          test ! -f public/app.js.map
          grep -q "coi-serviceworker v0.1.7" public/coi-serviceworker.js

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "public"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
